<!DOCTYPE html>
<html>
<head>
    <title>Age Verification ZKP</title>
</head>
<body>
    <h2>Age Verification Demo</h2>
    <input id="phone" type="text" placeholder="Enter phone number">
    <button id="verifyBtn">Verify Age</button>
    <div id="result"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/snarkjs@latest/build/snarkjs.min.js"></script>

    <script>
    document.getElementById("verifyBtn").onclick = async () => {
m
    const phone = document.getElementById("phone").value;

    try {

        // Step 1: Get DOB from backend
        const dobRes = await fetch("http://localhost:4000/get-dob", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ phone })
        });

        const dobData = await dobRes.json();

        if (dobData.error) {
            document.getElementById("result").innerText = dobData.error;
            return;
        }

        const birthYear = dobData.birthYear;

        // Step 2: Generate proof locally
        const input = {
            birthYear: birthYear,
            currentYear: 2026,
            requiredAge: 18
        };

        //loads the wasm. Generates the witness in memory. Generates the proof using .zkey
        const { proof, publicSignals } =
            await snarkjs.groth16.fullProve(
                input,
                "outputs/age_verification_js/age_verification.wasm",
                "outputs/age_verification_final.zkey"
            );

        // Step 3: Send proof to verifier
        const verifyRes = await fetch("http://localhost:3000/verify-age", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ proof, publicSignals })
        });

        const result = await verifyRes.json();

        document.getElementById("result").innerText =
            result.verified ? "Age Verified ✅" : "Not Verified ❌";

    } catch (err) {
        document.getElementById("result").innerText = "Error: " + err.message;
    }

};
    </script>
</body>
</html>
